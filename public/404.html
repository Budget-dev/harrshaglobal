<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harrsha Global</title>
    <script>
      // Single Page Apps for GitHub Pages and static hosts
      // Store current path and redirect to home index
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? '&' + l.search.slice(1) : '';
      var hash = l.hash || '';
      sessionStorage.setItem('redirect_path', redirectPath + query + hash);
      window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body>
    <p>Redirecting to Harrsha Global...</p>
  </body>
</html>
